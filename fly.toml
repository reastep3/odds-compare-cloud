# fly.toml — Fly.io app config for the Odds Compare Telegram bot.
#
# BEFORE DEPLOYING: change `app` to a globally-unique name (Fly will reject
# duplicates). Something like "odds-compare-<yourhandle>".

app            = "arbyx"
primary_region = "iad"

[build]

[env]
  DATA_DIR            = "/data/state"
  OUTPUT_DIR          = "/data/output"
  PYTHONUNBUFFERED    = "1"
  DEFAULT_DK_BANKROLL = "100"
  DEFAULT_FD_BANKROLL = "100"

# Single persistent volume — subdirs handle state vs. outputs.
[[mounts]]
  source      = "odds_data"
  destination = "/data"

[[vm]]
  memory   = "512mb"
  cpu_kind = "shared"
  cpus     = 1

# HTTP service for the PWA (Arbyx). The Telegram bot runs in the same
# process via long-polling — both share one asyncio loop. The bot still
# works even if the webapp crashes.
[http_service]
  internal_port       = 8080
  force_https         = true
  auto_stop_machines  = false   # keep the bot polling 24/7
  auto_start_machines = true
  min_machines_running = 1
  processes           = ["app"]

  [[http_service.checks]]
    grace_period  = "10s"
    interval      = "30s"
    method        = "GET"
    timeout       = "5s"
    path          = "/api/health"
